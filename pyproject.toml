[project]
name = "dailyplus-ai"
version = "0.1.0"
description = "AI-powered daily commander that saves 30 minutes/day"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.102.0",
    "bandit>=1.9.4",
    "langchain>=1.3.1",
    "langchain-anthropic>=1.4.3",
    "pre-commit>=4.6.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.0.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.13",
    "streamlit>=1.57.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
